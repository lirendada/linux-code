<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>出错了</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f1f1f1;
      }
      .error-container {
        margin: 10% auto;
        text-align: center;
      }
      h1 {
        font-size: 3rem;
        color: #333;
      }
      p {
        font-size: 1.2rem;
        color: #777;
        margin-bottom: 2rem;
      }
      a {
        display: inline-block;
        padding: 0.5rem 1rem;
        margin-top: 2rem;
        background-color: #007bff;
        color: #fff;
        border-radius: 4px;
        text-decoration: none;
        transition: background-color 0.2s ease;
      }
      a:hover {
        background-color: #0062cc;
      }
    </style>
  </head>
  <body>
    <div class="error-container">
      <h1>出错了</h1>
      <p>抱歉，您访问的页面暂时无法显示。</p>
      <a href="./index.html">返回首页</a>
    </div>
  </body>
</html>

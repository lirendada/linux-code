<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>按钮跳转页面</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                text-align: center;
                padding-top: 100px;
            }

            .button-container {
                margin: 20px;
            }

            .button {
                padding: 10px 20px;
                font-size: 18px;
                border-radius: 5px;
                text-decoration: none;
                color: #fff;
                background-color: #4CAF50;
                border: none;
                cursor: pointer;
            }

            .button:hover {
                background-color: #45a049;
            }
        </style>
    </head>
    <body>
        <h1>欢迎使用按钮跳转页面</h1>

        <div class="button-container">
            <a class="button" href="./login.html">登录</a>
        </div>

        <div class="button-container">
            <a class="button" href="./register.html">注册</a>
        </div>
    </body>
</html>
